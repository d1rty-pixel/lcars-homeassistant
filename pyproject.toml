[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lcars-homeassistant"
description = "A responsive LCARS dashboard framework for Home Assistant, built on LCARdS"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "jsonschema>=4"]
dynamic = ["version"]

[project.scripts]
lcars = "lcars.cli:main"

[tool.setuptools.dynamic]
version = {attr = "lcars.__version__"}

[tool.setuptools.packages.find]
include = ["lcars*"]

[tool.setuptools.package-data]
lcars = ["www/*.js", "themes/*.yaml"]
